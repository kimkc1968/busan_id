    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, query, onSnapshot, 
            addDoc, updateDoc, deleteDoc, where, getDocs, doc, writeBatch, setDoc, getDoc, setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Firestore 디버그 로깅 활성화
        setLogLevel('debug');

        // Firebase Global References (Accessible via window scope)
        window.firebase = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserSessionPersistence,
            getFirestore, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc,
            where, getDocs, doc, writeBatch, setDoc, getDoc

    <script>
        // --- Firebase Setup & State Management ---
        let db, auth;
        let employeeData = []; // 데이터베이스에서 가져온 데이터를 저장할 배열 
        let isAuthReady = false;
        
        let editingId = null; 
        let idToDelete = null; 
        
        const CORRECT_PASSWORD = 'leox1234'; 
        let isEditModeEnabled = false; 
        
        const statusOptions = ['근무중', '퇴사', '신청 없음', '신규 등록'];
        const leoxOptions = ['정상', '삭제', '미존재'];

        const messageContainer = document.getElementById('messageContainer');
        const statusTextElement = document.getElementById('statusText');
        const statusIconElement = document.getElementById('statusIcon');
        
        /**
         * DB 연결 상태 UI를 업데이트합니다.
         * @param {string} status 'success', 'loading', 'error'
         * @param {string} message 표시할 메시지
         */
        function updateDbStatusUI(status, message) {
            statusTextElement.textContent = message;
            statusIconElement.classList.remove('bg-yellow-500', 'bg-green-600', 'bg-red-600', 'animate-pulse');
            statusIconElement.classList.add('w-3', 'h-3'); // 크기 초기화

            switch (status) {
                case 'success':
                    statusTextElement.classList.remove('text-yellow-600', 'text-red-600');
                    statusTextElement.classList.add('text-green-600');
                    statusIconElement.classList.add('bg-green-600');
                    break;
                case 'error':
                    statusTextElement.classList.remove('text-yellow-600', 'text-green-600');
                    statusTextElement.classList.add('text-red-600');
                    statusIconElement.classList.add('bg-red-600');
                    break;
                case 'loading':
                default:
                    statusTextElement.classList.remove('text-green-600', 'text-red-600');
                    statusTextElement.classList.add('text-yellow-600');
                    statusIconElement.classList.add('bg-yellow-500', 'animate-pulse');
                    break;
            }
        }
        
        /**
         * Firebase 및 Auth를 초기화하고 데이터 로드를 시작합니다.
         */
        async function initializeFirebase() {
            updateDbStatusUI('loading', '연결 확인 중...');
            
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
            const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            
            const { initializeApp, getAuth, signInWithCustomToken, signInAnonymously, getFirestore, collection, onSnapshot } = window.firebase;

            if (Object.keys(firebaseConfig).length === 0) {
                console.error("Firebase 설정이 제공되지 않았습니다. 데이터를 저장할 수 없습니다.");
                updateDbStatusUI('error', '🔴 연결 실패: 설정 없음');
                messageContainer.innerHTML = '<p class="text-red-600 font-bold">⚠️ Firebase 설정 데이터가 없어 연결할 수 없습니다.</p>';
                hideLoading();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                const COLLECTION_PATH = `artifacts/${appId}/public/data/employees`;
                
                // 1. 인증 처리
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                isAuthReady = true;
                updateDbStatusUI('success', '🟢 연결 성공');
                console.log("Firebase 인증 성공.");
                
                // 2. 실시간 데이터 리스너 설정
                const q = collection(db, COLLECTION_PATH);
                onSnapshot(q, (snapshot) => {
                    const newEmployeeData = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        newEmployeeData.push({ 
                            ...data, 
                            docId: doc.id, 
                            leoxId: data.leoxId 
                        });
                    });
                    employeeData = newEmployeeData;
                    console.log(`Firestore에서 ${employeeData.length}개의 데이터 업데이트됨.`);
                    
                    if (employeeData.length === 0) {
                        // 데이터가 없으면 초기 데이터 시드 시도 (사용자 요청 목록으로 업데이트됨)
                        seedInitialData(db, COLLECTION_PATH);
                    }
                    
                    filterTable(); 
                    hideLoading();

                }, (error) => {
                    console.error("Firestore 데이터 로드 중 오류:", error);
                    updateDbStatusUI('error', '🔴 데이터 로드 실패');
                    messageContainer.innerHTML = '<p class="text-red-600 font-bold">⚠️ 데이터베이스에서 데이터를 불러오는 데 실패했습니다. 권한 문제일 수 있습니다.</p>';
                    hideLoading();
                });

            } catch (error) {
                console.error("Firebase 초기화 또는 인증 실패:", error);
                updateDbStatusUI('error', '🔴 연결 실패: 인증 오류');
                messageContainer.innerHTML = '<p class="text-red-600 font-bold">⚠️ Firebase 인증에 실패했습니다. (콘솔 로그 확인)</p>';
                hideLoading();
            }
        }
        
        /**
         * 초기 데이터 시뮬레이션 및 Firestore에 저장 (데이터가 0개일 때만 실행)
         * 사용자 요청 데이터를 반영하여 업데이트되었습니다.
         */

                { name: "고성자", leoxId: "busan022", status: "근무중", leoxStatus: "정상" },
                { name: "이수진", leoxId: "busan023", status: "근무중", leoxStatus: "정상" },
            ];

            // 모든 항목에 초기 이력 추가 (history가 없는 경우에만 추가)
            const seededEmployees = initialEmployees.map(emp => {
                if (emp.history && emp.history.length > 0) {
                    return emp; // 이미 이력이 있는 경우 (busan015)는 건너뜁니다.
                }

                // 이력이 없는 경우에만 기본 이력을 추가합니다.
                return {
                    ...emp,
                    history: [{ 
                        date: new Date().toISOString().substring(0, 10), 
                        type: "최초 생성 (요청 데이터)", 
                        details: "사용자 요청에 따라 초기 데이터로 등록됨." 
                    }]
                };
            });
            
            const { collection, addDoc } = window.firebase;

            console.log("초기 데이터가 없어 시뮬레이션 데이터로 Firestore를 채웁니다...");
            messageContainer.innerHTML = '<p class="text-blue-600 font-bold">데이터베이스에 데이터가 없어 샘플 데이터를 생성 중입니다...</p>';
            
            const batch = window.firebase.writeBatch(db);
            
            for (const employee of seededEmployees) {
                 const newDocRef = window.firebase.doc(collection(db, COLLECTION_PATH));
                 batch.set(newDocRef, employee);
            }
            
            try {
                await batch.commit();
                console.log("시뮬레이션 데이터 일괄 저장 성공.");
            } catch (e) {
                console.error("시뮬레이션 데이터 저장 실패:", e);
                messageContainer.innerHTML = '<p class="text-red-600 font-bold">⚠️ 샘플 데이터 생성에 실패했습니다. (콘솔 로그 확인)</p>';
            }
            // onSnapshot 리스너가 새 데이터를 자동으로 가져와 테이블을 업데이트할 것입니다.
        }

        // --- 로딩 및 메시지 처리 ---
        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        /**
         * 테이블 본문을 숨기고 메시지를 표시하거나, 메시지를 숨기고 테이블을 표시합니다.
         */
        function displayMessage(type, text) {
            const tbody = document.getElementById('employeeTableBody');
            const container = document.getElementById('messageContainer');

            if (type === 'none') {
                container.classList.add('hidden');
                tbody.style.display = 'table-row-group';
                return;
            }

            tbody.style.display = 'none';
            container.classList.remove('hidden');
            
            let color = 'text-gray-500';
            let prefix = '';
            if (type === 'error') {
                color = 'text-red-600';
                prefix = '⚠️ 오류: ';
            } else if (type === 'info') {
                color = 'text-blue-600';
                prefix = 'ℹ️ 정보: ';
            } else if (type === 'noresults') {
                color = 'text-gray-500';
                prefix = '🔍 ';
            }
            
            container.className = `text-center p-8 text-lg ${color}`;
            container.innerHTML = `<p class="font-bold">${prefix}${text}</p>`;
        }


        // --- UI 업데이트 및 액션 함수 (생략된 부분은 변경 없음) ---

        function getStatusGroup(statusText) {
            switch (statusText) {
                case '근무중':
                case '정상':
                    return 'green';
                case '퇴사':
                case '삭제':
                case '휴직':
                case '일시 정지':
                    return 'red';
                case '신규 등록':
                    return 'yellow'; 
                case '신청 없음':
                case '미존재':
                default:
                    return 'gray';
            }
        }

        function getStatusClasses(statusGroup) {
            switch (statusGroup) {
                case 'green': 
                    return { badgeBg: 'bg-blue-200', badgeText: 'text-blue-800', rowBg: 'bg-blue-50/70', hoverBg: 'hover:bg-blue-100' };
                case 'red': 
                    return { badgeBg: 'bg-red-200', badgeText: 'text-red-700', rowBg: 'bg-red-100/70', hoverBg: 'hover:bg-red-200' };
                case 'yellow': 
                    return { badgeBg: 'bg-yellow-200', badgeText: 'text-yellow-800', rowBg: 'bg-yellow-50/70', hoverBg: 'hover:bg-yellow-100' };
                case 'gray': 
                default:
                    return { badgeBg: 'bg-gray-200', badgeText: 'text-gray-600', rowBg: 'bg-gray-50/70', hoverBg: 'hover:bg-gray-100' };
            }
        }

        function createStatusBadge(statusText) {
            const statusGroup = getStatusGroup(statusText);
            const { badgeBg, badgeText } = getStatusClasses(statusGroup);
            return `<span class="status-badge ${badgeBg} ${badgeText}">${statusText}</span>`;
        }

        function highlightNameInHistoryType(typeString) {
            const colorClass = 'text-red-600 font-bold';
            let result = typeString;
            result = result.replace(
                /([가-힣]+)(님)/g, 
                (match, name, suffix) => `<span class="${colorClass}">${name}</span>${suffix}`
            );
            result = result.replace(
                /\((.*?)\)/g, 
                (match) => {
                    return match.replace(
                        /([가-힣]+)/g, 
                        (nameMatch) => `<span class="${colorClass}">${nameMatch}</span>`
                    );
                }
            );
            
            return result;
        }

        function createHistoryDetails(history) {
            if (!history || history.length === 0) {
                return '<p class="text-gray-500 italic p-4">등록된 변경 이력이 없습니다.</p>';
            }
            const sortedHistory = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
            const listItems = sortedHistory.map(item => {
                let detailsHtml = '';
                if (item.changes) {
                    detailsHtml = '<div class="mt-2 text-sm text-gray-700 space-y-1 bg-gray-50 p-3 rounded-lg border border-gray-200">';
                    detailsHtml += '<p class="font-bold text-blue-700">주요 변경 사항:</p>';
                    const fieldMap = { leoxId: '아이디', name: '이름', status: '근무여부', leoxStatus: 'LeoX 상태' };
                    Object.keys(item.changes).forEach(field => {
                        const fieldName = fieldMap[field] || field;
                        const change = item.changes[field];
                        detailsHtml += `<p><span class="font-semibold">${fieldName}:</span> <span class="text-red-500">${change.from}</span> &rarr; <span class="text-green-600 font-bold">${change.to}</span></p>`;
                    });
                    detailsHtml += '</div>';
                }
                detailsHtml += `<p class="text-sm text-gray-600 mt-2">${item.details}</p>`;
                const highlightedType = highlightNameInHistoryType(item.type);
                return `
                    <li class="p-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-semibold text-gray-800">${highlightedType}</span>
                            <span class="text-xs text-gray-500">${item.date}</span>
                        </div>
                        ${detailsHtml}
                    </li>
                `;
            }).join('');
            return `
                <div class="p-6">
                    <h4 class="text-lg font-bold mb-4 text-blue-800 border-b pb-2">변경 이력 (${history.length}건)</h4>
                    <ul class="space-y-4 history-list">
                        ${listItems}
                    </ul>
                </div>
            `;
        }

        function getNextEmployeeId() {
            let maxNum = 0;
            employeeData.forEach(data => {
                const match = data.leoxId.match(/^busan(\d+)$/);
                if (match) {
                    const num = parseInt(match[1], 10);
                    if (num > maxNum) {
                        maxNum = num;
                    }
                }
            });

            const nextNum = maxNum + 1;
            const nextIdSuffix = String(nextNum).padStart(3, '0');
            return `busan${nextIdSuffix}`;
        }

        function renderTable(dataToRender = employeeData) {

            if (dataToRender.length === 0) {
                tbody.innerHTML = '';
                // 데이터는 있지만 필터링 결과가 없는 경우 vs. 데이터 로드 실패/데이터 자체가 없는 경우
                if (employeeData.length > 0) {
                    displayMessage('noresults', '검색 조건에 맞는 데이터가 없습니다.');
                } else if (statusTextElement.textContent.includes('연결 성공')) {
                    displayMessage('info', '데이터베이스에 직원 정보가 없습니다. "신규 ID 생성" 버튼을 클릭하여 시작하거나 기본 데이터를 로드하세요.');

                        <div class="flex flex-col space-y-1">

                            <button onclick="cancelEdit(event, '${data.docId}')" class="text-xs font-bold py-1 px-2 rounded-md bg-red-500 text-white hover:bg-red-600 transition duration-150 shadow-md">취소</button>
                        </div>

                    let editButtonHtml = '';
                    let deleteButtonHtml = '';

                        editButtonHtml = `<button onclick="toggleEditMode(event, '${data.docId}')" class="text-xs font-bold py-1 px-2 rounded-md bg-blue-500 text-white hover:bg-blue-600 transition duration-150 shadow-md">수정</button>`;
                        deleteButtonHtml = `<button onclick="confirmAndDelete(event, '${data.docId}', '${data.name}', '${data.leoxId}')" class="text-xs font-bold py-1 px-2 rounded-md bg-red-500 text-white hover:bg-red-600 transition duration-150 shadow-md">삭제</button>`;

                    if (isEditModeEnabled) {
                        actionContent = `
                            <div class="flex flex-col space-y-1 items-center">
                                <div class="flex space-x-1 w-full justify-center">
                                    ${editButtonHtml}
                                    ${deleteButtonHtml}
                                </div>
                                ${hasHistory ? `<div class="mt-1">${toggleIcon}</div>` : ''}
                            </div>
                        `;
                    } else if (!isEditModeEnabled && hasHistory) {
                        actionContent = `
                            <div class="flex items-center justify-center space-x-2">
                                ${toggleIcon}
                            </div>
                        `;
                    } else { 
                        actionContent = `<span class="text-gray-400">-</span>`;
                    }
                }
                
                const statusSelectOptions = statusOptions.map(opt => 
                    `<option value="${opt}" ${data.status === opt ? 'selected' : ''}>${opt}</option>`
                ).join('');

                    `<option value="${opt}" ${data.leoxStatus === opt ? 'selected' : ''}>${opt}</option>`
                ).join('');


                const mainRow = `
                    <tr class="data-row ${isEditing ? 'editing bg-yellow-100 hover:bg-yellow-100' : rowBg + ' ' + hoverBg}" data-doc-id="${data.docId}" data-leox-id="${data.leoxId}" data-status="${data.status}" data-leox-status="${data.leoxStatus}" data-name="${data.name}" onclick="handleActionOrHistory(event, '${data.docId}', ${hasHistory})">

                        </td>
                        
                        <!-- 근무여부 (편집 가능) -->

                            </div>
                        </td>
                    </tr>
                `;

                return mainRow + historyRow;
            }).join('');

            tbody.innerHTML = htmlContent;
        }

        function handleActionOrHistory(event, docId, hasHistory) {
            if (editingId) return;

            if (event && event.target.closest('button')) {
                return;
            }
            
            if (!hasHistory) return;

            const row = document.querySelector(`.data-row[data-doc-id="${docId}"]`);
            const historyIcon = row ? row.querySelector('.toggle-icon') : null;
            if (row && historyIcon) {
                toggleHistoryDetails(docId, row, historyIcon);
            }
        }

        function toggleHistoryDetails(docId, row, icon) {
            const tbody = document.getElementById('employeeTableBody');
            const historyRow = tbody.querySelector(`tr[data-history-id="${docId}"]`);
            if (!historyRow) return;

            const detailContent = historyRow.querySelector('div');
            const isCurrentlyOpen = historyRow.style.display === 'table-row';
            
            const statusGroup = row.getAttribute('data-status') ? getStatusGroup(row.getAttribute('data-status')) : 'gray';
            const { rowBg } = getStatusClasses(statusGroup);


            tbody.querySelectorAll('.history-row').forEach(tr => {
                const relatedDocId = tr.getAttribute('data-history-id');
                const relatedRow = tbody.querySelector(`.data-row[data-doc-id="${relatedDocId}"]`);
                const relatedIcon = relatedRow ? relatedRow.querySelector('.toggle-icon') : null;
                
                const relatedStatusGroup = relatedRow.getAttribute('data-status') ? getStatusGroup(relatedRow.getAttribute('data-status')) : 'gray';
                const { rowBg: relatedRowBg } = getStatusClasses(relatedStatusGroup); 

                if (tr.style.display === 'table-row') {
                    tr.style.display = 'none';
                    tr.querySelector('div').style.maxHeight = '0';
                    if (relatedRow && !relatedRow.classList.contains('editing')) {
                         relatedRow.classList.remove('bg-blue-100');
                         relatedRow.classList.add(relatedRowBg);
                    }
                    if (relatedIcon) relatedIcon.style.transform = 'rotate(0deg)';
                }
            });
            
            if (!isCurrentlyOpen) {
                historyRow.style.display = 'table-row';
                setTimeout(() => {
                    detailContent.style.maxHeight = `${detailContent.scrollHeight + 10}px`; 
                }, 50);

                if (icon) icon.style.transform = 'rotate(90deg)';
                
                row.classList.remove(rowBg);
                row.classList.add('bg-blue-100'); 
            }
        }

        function toggleEditMode(event, docId) {
            if (event) event.stopPropagation(); 

            if (!isEditModeEnabled) {
                console.warn("[경고] 수정 모드가 비활성화되어 있습니다. 먼저 비밀번호를 입력하여 활성화해주세요.");
                return;
            }
            
            if (editingId && editingId !== docId) {
                console.warn(`[경고] 다른 항목의 편집을 먼저 저장하거나 취소해주세요.`);
                return;
            }
            
            const row = document.querySelector(`.data-row[data-doc-id="${docId}"]`);
            if (!row) return;

            const historyIcon = row.querySelector('.toggle-icon');
            if (row.classList.contains('bg-blue-100') && historyIcon) {
                toggleHistoryDetails(docId, row, historyIcon);
            }
            
            editingId = docId;
            row.classList.add('editing', 'bg-yellow-100', 'hover:bg-yellow-100');
            
            const statusGroup = getStatusGroup(row.getAttribute('data-status'));
            const { rowBg, hoverBg } = getStatusClasses(statusGroup);
            row.classList.remove(rowBg, hoverBg);


            row.querySelectorAll('[data-field]').forEach(cell => {
                cell.querySelector('.display-value').classList.add('hidden');
                const input = cell.querySelector('.edit-input') || cell.querySelector('.edit-select');
                if (input) input.classList.remove('hidden');
            });
            
            const actionCell = row.querySelector('.data-action');
            actionCell.innerHTML = `
                <div class="flex flex-col space-y-1">
                    <button onclick="saveChanges(event, '${docId}')" class="text-xs font-bold py-1 px-2 rounded-md bg-green-500 text-white hover:bg-green-600 transition duration-150 shadow-md">저장</button>
                    <button onclick="cancelEdit(event, '${docId}')" class="text-xs font-bold py-1 px-2 rounded-md bg-red-500 text-white hover:bg-red-600 transition duration-150 shadow-md">취소</button>
                </div>
            `;
            actionCell.onclick = (e) => e.stopPropagation();
        }

        async function saveChanges(event, docId) {
            event.stopPropagation();

            if (!isAuthReady) {
                 console.error("데이터베이스 연결 준비 안됨.");
                 return;
            }
            
            const row = document.querySelector(`.data-row[data-doc-id="${docId}"]`);
            if (!row) return;
            
            const employee = employeeData.find(d => d.docId === docId);
            if (!employee) return;

            const newValues = {};
            const changes = {};

            let hasChanges = false;
            
            row.querySelectorAll('[data-field]').forEach(cell => {
                const fieldName = cell.getAttribute('data-field');
                const input = cell.querySelector('.edit-input') || cell.querySelector('.edit-select');
                
                if (input) {
                    const newValue = input.value.trim();
                    const oldValue = input.getAttribute('data-old-value').trim();
                    
                    if (newValue !== oldValue) {
                        hasChanges = true;
                        newValues[fieldName] = newValue;

                        changes[fieldName] = { from: oldValue, to: newValue };
                        
                        input.setAttribute('data-old-value', newValue);
                    }
                }
            });

            if (!hasChanges) {
                console.log(`Doc ID ${docId}: 변경 사항이 없습니다. 편집 모드를 종료합니다.`);
                cancelEdit(event, docId);
                return;
            }

            showLoading();

            const employeeName = newValues.name || employee.name; 
            let typeDescription = `직원 상태 변경 (${employeeName})`;
            
            if (changes.status && changes.status.to === '퇴사' && changes.leoxStatus && changes.leoxStatus.to === '삭제') {
                 typeDescription = `${employeeName}님 퇴사 및 ID 삭제 처리`;
            } else if (changes.status && changes.status.to === '신청 없음' && changes.leoxStatus && changes.leoxStatus.to === '미존재' && (changes.name && changes.name.to === '없음')) {
                 const formerName = changes.name ? changes.name.from : employee.name;
                 typeDescription = `ID 초기화 (이전 사용자: ${formerName})`;
            } else if (changes.status && changes.status.from === '신규 등록') {
                 typeDescription = `신규 등록 항목 최종 저장 (${employeeName})`;
            } else if (changes.status && changes.status.from === '신청 없음' && changes.name && changes.name.from === '없음') {
                 typeDescription = `ID 재할당 및 신규 등록 (${employeeName})`;
            } else if (changes.name) {
                 typeDescription = `직원 이름 및 상태 변경 (${employeeName})`;
            } else {
                 typeDescription = `직원 상태 변경 (${employeeName})`;
            }

            const newHistoryEntry = {
                date: new Date().toISOString().substring(0, 10),
                type: typeDescription,
                details: `${employeeName}님의 현황이 업데이트되었습니다. (${Object.keys(changes).length}개 필드 변경됨. 대시보드 수정 기능 사용)`,
                changes: changes,
            };

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const COLLECTION_PATH = `artifacts/${appId}/public/data/employees`;
            const { doc, updateDoc } = window.firebase;

            try {
                const docRef = doc(db, COLLECTION_PATH, docId);
                
                const fieldsToUpdate = { ...newValues };
                
                const updatedHistory = [newHistoryEntry, ...(employee.history || [])];
                fieldsToUpdate.history = updatedHistory;

                await updateDoc(docRef, fieldsToUpdate);

                console.log(`Doc ID ${docId}의 데이터 업데이트 완료.`);

            } catch (error) {
                 console.error(`Doc ID ${docId} 업데이트 중 오류 발생:`, error);
            } finally {
                editingId = null;
                hideLoading();
            }
        }

        function cancelEdit(event, docId) {
            if (event) event.stopPropagation();
            
            const row = document.querySelector(`.data-row[data-doc-id="${docId}"]`);
            if (!row) return;

            row.querySelectorAll('[data-field]').forEach(cell => {
                const input = cell.querySelector('.edit-input') || cell.querySelector('.edit-select');
                if (input) {
                    input.value = input.getAttribute('data-old-value'); 
                    input.classList.add('hidden');
                }
                cell.querySelector('.display-value').classList.remove('hidden');
            });
            
            editingId = null;
            row.classList.remove('editing', 'bg-yellow-100', 'hover:bg-yellow-100');
            
            filterTable();
        }

        const statusFilter = document.getElementById('statusFilter'); 
        const searchFilter = document.getElementById('searchFilter');

        const filterTable = () => {
            const selectedStatus = statusFilter.value;
            const searchQuery = searchFilter.value.toLowerCase().trim();

            const filteredData = employeeData.filter(data => {
                const statusMatch = (selectedStatus === '전체' || data.status === selectedStatus || (selectedStatus === '근무중' && data.status === '신규 등록')); 
                const searchMatch = (
                    searchQuery === '' || 
                    data.name.toLowerCase().includes(searchQuery) || 
                    data.leoxId.toLowerCase().includes(searchQuery) 
                );
                return statusMatch && searchMatch;
            });

            renderTable(filteredData);
        };

        document.addEventListener('DOMContentLoaded', () => {
            showLoading();
            initializeFirebase();
            
            document.querySelectorAll('.status-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    const status = e.target.getAttribute('data-status');
                    document.getElementById('statusFilter').value = status;
                    filterTable();
                    updateStatusButtonStyles(status);
                });
            });

            updateStatusButtonStyles(document.getElementById('statusFilter').value); 
            
            searchFilter.addEventListener('input', filterTable);

            document.getElementById('toggleEditModeBtn').addEventListener('click', toggleEditModeActivation);
            document.getElementById('addNewIdBtn').addEventListener('click', addNewEmployee);
            updateEditModeUI(); 

            document.getElementById('cancelPasswordBtn').addEventListener('click', hidePasswordModal);
            document.getElementById('submitPasswordBtn').addEventListener('click', () => {
                const password = document.getElementById('passwordInput').value;
                checkPasswordAndActivate(password);
            });
            document.getElementById('passwordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const password = document.getElementById('passwordInput').value;
                    checkPasswordAndActivate(password);
                }
            });

            document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
                document.getElementById('deleteConfirmationModal').classList.add('hidden');
                idToDelete = null;
            });
            document.getElementById('confirmDeleteBtn').addEventListener('click', deleteEmployee);
        });
    </script>
</body>
</html>
